groups:

  - name: fraud-drift-alerts

    rules:

      - alert: FraudFeatureHighDrift

        expr: fraud_feature_drift_psi >= 0.25

        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High feature drift detected"

          description: "Feature {{ $labels.feature }} has PSI value {{ $value }} which is above the high-drift threshold of 0.25."


      - alert: FraudDriftMonitorError

        expr: fraud_drift_monitor_status == 2

        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Fraud drift monitor failed"

          description: "The fraud drift monitoring process is reporting an ERROR state."