name: Fraud Detection CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frauddb
          POSTGRES_USER: frauduser
          POSTGRES_PASSWORD: fraudpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U frauduser -d frauddb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create CI test models
        run: |
          python -m tests.create_ci_models
          rm -rf models/mlflow_champion
          mv models/ci_mlflow_champion models/mlflow_champion

      - name: Create database table
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: frauddb
          DB_USER: frauduser
          DB_PASSWORD: fraudpassword
        run: |
          python - <<'PY'
          import os
          import psycopg

          connection = psycopg.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"]
          )

          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  CREATE TABLE IF NOT EXISTS transactions (
                      id BIGSERIAL PRIMARY KEY,
                      created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                      step INTEGER NOT NULL,
                      type VARCHAR(20) NOT NULL,
                      amount DOUBLE PRECISION NOT NULL,
                      old_balance_org DOUBLE PRECISION NOT NULL,
                      new_balance_orig DOUBLE PRECISION NOT NULL,
                      old_balance_dest DOUBLE PRECISION NOT NULL,
                      new_balance_dest DOUBLE PRECISION NOT NULL,
                      fraud_probability DOUBLE PRECISION NOT NULL,
                      risk_decision VARCHAR(10) NOT NULL,
                      anomaly_score DOUBLE PRECISION NOT NULL
                  );
                  """
              )

          connection.commit()
          connection.close()

          print("Database table created successfully")

      - name: Build Docker image
        run: |
          docker build -t fraud-detection-api:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name fraud-api-ci \
            --network host \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -e API_KEY=fraud-dev-secret-2026 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=frauddb \
            -e DB_USER=frauduser \
            -e DB_PASSWORD=fraudpassword \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            fraud-detection-api:ci

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to become healthy"
          docker logs fraud-api-ci
          exit 1

      - name: Run integration tests inside Docker
        run: |
          docker exec \
            -e API_KEY=fraud-dev-secret-2026 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=frauddb \
            -e DB_USER=frauduser \
            -e DB_PASSWORD=fraudpassword \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            fraud-api-ci \
            sh -c "rm -rf /tmp/tests && cp -r /app/tests /tmp/tests && python -m pytest -v /tmp/tests"

      - name: Docker prediction smoke test
        run: |
          curl -fs \
            -X POST \
            http://localhost:8000/predict \
            -H "X-API-Key: fraud-dev-secret-2026" \
            -H "Content-Type: application/json" \
            -d '{
              "step": 900,
              "type": "TRANSFER",
              "amount": 100000.0,
              "oldbalanceOrg": 100000.0,
              "newbalanceOrig": 0.0,
              "oldbalanceDest": 50000.0,
              "newbalanceDest": 150000.0
            }'

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker logs fraud-api-ci

      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f fraud-api-ci || true